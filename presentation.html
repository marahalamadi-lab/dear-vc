<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>DEAR VC — عرض اللجنة الاستراتيجية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen slide deck — login → loading → 11 slides; fixed bottom bar with progress, counter, controls and footer note.
   ── عدّلي الألوان من هنا ── */
:root{
  --bg:#f5f2f9; --bg2:#ece5f4; --glass:rgba(255,255,255,.72); --glass-line:rgba(106,45,150,.14);
  --ink:#1e1828; --muted:#675f75; --line:#e2dbec;
  --brand:#6a2d96; --brand-2:#8f63c9; --brand-ink:#ffffff; --brand-soft:#efe5f7;
  --done:#1f8a5b; --run:#2f63c4; --late:#c2413a; --next:#8a7f99; --hi:#b7791f;
  --done-soft:#e1f3ea; --run-soft:#e3ebfa; --late-soft:#fae5e3; --next-soft:#eeebf2; --hi-soft:#fbf0dc;
  --shadow:0 10px 30px rgba(60,20,90,.08);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --bg2:#1d1726; --glass:rgba(34,27,44,.72); --glass-line:rgba(183,139,224,.18);
  --ink:#efe9f6; --muted:#a79fb5; --line:#342c40;
  --brand:#b78be0; --brand-2:#9a6fd6; --brand-ink:#1a1022; --brand-soft:#2e2340;
  --done:#4cc28b; --run:#76a2f0; --late:#f07c72; --next:#a79cb8; --hi:#e3b05a;
  --done-soft:#17332a; --run-soft:#1a2740; --late-soft:#3d1f1d; --next-soft:#2a2533; --hi-soft:#3a2d16;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --bg2:#1d1726; --glass:rgba(34,27,44,.72); --glass-line:rgba(183,139,224,.18);
  --ink:#efe9f6; --muted:#a79fb5; --line:#342c40;
  --brand:#b78be0; --brand-2:#9a6fd6; --brand-ink:#1a1022; --brand-soft:#2e2340;
  --done:#4cc28b; --run:#76a2f0; --late:#f07c72; --next:#a79cb8; --hi:#e3b05a;
  --done-soft:#17332a; --run-soft:#1a2740; --late-soft:#3d1f1d; --next-soft:#2a2533; --hi-soft:#3a2d16;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 60%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{opacity:.92;color:var(--brand-ink)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-تمت{background:var(--done-soft);color:var(--done)} .p-جارية{background:var(--run-soft);color:var(--run)}
.p-متأخرة{background:var(--late-soft);color:var(--late)} .p-قادمة{background:var(--next-soft);color:var(--next)} .p-hi{background:var(--hi-soft);color:var(--hi)}

/* screens */
.screen{position:fixed;inset:0;display:grid;place-items:center;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.login{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px;width:min(960px,100%)}
@media (max-width:760px){.login{grid-template-columns:minmax(0,1fr)}}
.login-main{padding:32px;display:grid;gap:18px;align-content:start}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo-chip{display:inline-flex;background:var(--logo-bg,transparent);border-radius:12px;padding:4px 8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-chip{background:#f3eff7}}
:root[data-theme="dark"] .logo-chip{background:#f3eff7}
.logo{height:60px;width:auto;display:block}
.dear{font-family:var(--f-display);font-size:30px;letter-spacing:.06em;display:flex;gap:.28em;direction:ltr}
.dear b{font-weight:700;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dear i{font-style:normal;font-weight:400;color:var(--muted)}
.login h1{font-size:clamp(26px,4vw,36px)}
.login .sub{color:var(--muted)}
.conn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--hi);animation:pulse 1s ease-in-out infinite}
.conn.ok i{background:var(--done);animation:none;box-shadow:0 0 0 4px var(--done-soft)}
@keyframes pulse{50%{opacity:.3}}
.code-row{display:flex;gap:8px;flex-wrap:wrap}
.code-row input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;letter-spacing:.15em;text-align:center;direction:ltr}
.code-msg{min-height:1.5em;font-size:13px;color:var(--late)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.author{padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;align-content:center}
.author .qr{width:170px;height:170px;border-radius:12px;background:#fff;padding:8px}
.author small{color:var(--muted)}
.loading{display:grid;gap:16px;justify-items:center;text-align:center;max-width:460px}
.ring{width:120px;height:120px}
.ring circle{fill:none;stroke-width:8}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;transform:rotate(-90deg);transform-origin:center;animation:fill 2.4s ease-in-out forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.loading p{color:var(--muted);margin:0}

/* deck */
#deck{position:fixed;inset:0}
.slide{position:absolute;inset:calc(60px + env(safe-area-inset-top,0px)) 0 64px 0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(-24px);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.slide.prev{transform:translateX(24px)}
.inner{max-width:1180px;margin:0 auto;min-height:100%;display:grid;gap:18px;align-content:center}
.s-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.s-head h2{font-size:clamp(22px,3vw,32px)}
.s-head .k{color:var(--brand);font-size:13px;font-weight:600;letter-spacing:.02em}
.s-head p{margin:0;color:var(--muted);font-size:14px}
.slide.on .rise{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{position:fixed;inset:auto 0 0 0;height:64px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--glass);border-top:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.bar .prog{position:absolute;inset:0 0 auto 0;height:3px;background:var(--line)}
.bar .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width .4s ease;margin-inline-start:0}
.bar .note{font-size:12px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ctl{display:flex;gap:6px;align-items:center}
.bar .count{font-size:13px;color:var(--muted);min-width:52px;text-align:center}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px}
@media (max-width:560px){.bar .note{display:none}.bar{grid-template-columns:auto minmax(0,1fr) auto}}

/* brand strip on every slide */
.brandtop{position:fixed;inset:0 0 auto 0;height:calc(60px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--glass);border-bottom:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.logo.sm{height:36px}
.logo-chip:has(.logo.sm){padding:2px 6px;border-radius:8px}
.dear.sm{font-size:22px}
/* cover */
.cover{display:grid;gap:22px;justify-items:start}
.cover .dear{font-size:clamp(48px,9vw,96px)}
.cover h1{font-size:clamp(26px,4vw,44px)}
.cover .meta{display:flex;gap:10px;flex-wrap:wrap}
.cover .meta span{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:4px 14px;font-size:14px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:22px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:clamp(36px,6vw,58px);font-weight:700;line-height:1}
.kpi .l{color:var(--muted)}
.kpi.done .v{color:var(--done)} .kpi.run .v{color:var(--run)} .kpi.late .v{color:var(--late)} .kpi.next .v{color:var(--next)} .kpi.pct .v{color:var(--brand)}

/* axes */
.axes{padding:22px;display:grid;gap:16px}
.ax{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(0,2.4fr) 56px;gap:14px;align-items:center;cursor:pointer;border-radius:10px;padding:4px}
.ax:hover{background:var(--brand-soft)}
.ax small{display:block;color:var(--muted);font-size:12px}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.s-done{background:var(--done)} .s-run{background:var(--run)} .s-late{background:var(--late)} .s-next{background:var(--next);opacity:.55}
.ax .pc{font-weight:700;font-family:var(--f-display);text-align:left}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
@media (max-width:520px){.ax{grid-template-columns:minmax(0,1fr) 48px}.ax .stack{grid-column:1/-1;order:3}}

/* donut */
.donut{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:24px;align-items:center;padding:24px}
@media (max-width:720px){.donut{grid-template-columns:minmax(0,1fr);justify-items:center}}
.donut svg{width:100%;max-width:300px;height:auto}
.st-rows{display:grid;gap:10px;width:100%}
.st-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.st-row b{font-family:var(--f-display);font-size:22px}
.st-row .mb{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.st-row .mb i{display:block;height:100%}

/* focus */
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.focus{grid-template-columns:minmax(0,1fr)}}
.fc{padding:18px;display:grid;gap:10px;align-content:start;border-top:3px solid var(--hi);cursor:pointer;min-width:0}
.fc .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.fc h3{font-size:17px}
.fc dl{margin:0;display:grid;gap:6px}
.fc dt{font-size:12px;color:var(--muted);font-weight:600}
.fc dd{margin:0;font-size:13.5px}
.pbar{display:flex;align-items:center;gap:8px;font-size:13px}
.pbar .t{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar .t i{display:block;height:100%;background:var(--brand)}

/* gantt */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.gantt{padding:14px;overflow-x:auto}
.g-grid{display:grid;grid-template-columns:minmax(200px,260px) repeat(var(--q),minmax(34px,1fr));gap:3px 2px;min-width:720px;font-size:13px;align-items:center}
.g-h{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
.g-h.now{color:var(--brand);font-weight:700}
.g-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-end:8px;cursor:pointer}
.g-c{height:20px;background:var(--line);opacity:.5;border-radius:3px}
.g-c.now{outline:2px solid var(--brand);outline-offset:-1px;opacity:1;background:transparent}
.g-bar{height:20px;border-radius:5px;cursor:pointer}
.g-ax{grid-column:1/-1;font-weight:600;color:var(--brand);font-size:12.5px;padding-top:6px}

/* late */
.late-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.late-list{grid-template-columns:minmax(0,1fr)}}
.lt{padding:16px;display:grid;gap:6px;border-inline-start:4px solid var(--late);cursor:pointer}
.lt .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lt b.od{color:var(--late)}

/* managers */
.pms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.pms{grid-template-columns:minmax(0,1fr)}}
.pm{padding:20px;display:grid;gap:10px;align-content:start}
.pm .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-family:var(--f-display);font-weight:700;font-size:18px}
.pm .big{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--brand);line-height:1}
.pm ul{margin:0;padding-inline-start:18px;color:var(--muted);font-size:13.5px}
.pm .mini{display:flex;gap:6px;flex-wrap:wrap}

/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input,.tools select{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:6px 10px;font-size:13.5px;min-width:0}
.tools input{flex:1 1 200px}
.tbl{overflow:auto;max-height:min(60vh,560px)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--bg2);font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
thead th[aria-sort="ascending"]::after{content:" ▲"} thead th[aria-sort="descending"]::after{content:" ▼"}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--brand-soft)}

/* decisions */
.dec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.dec{grid-template-columns:minmax(0,1fr)}}
.dec .glass{padding:20px;display:grid;gap:12px;align-content:start}
.dec ol{margin:0;padding-inline-start:20px;display:grid;gap:10px}
.dec li small{display:block;color:var(--muted)}

/* closing */
.closing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
@media (max-width:720px){.closing{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.closing .qr{width:200px;height:200px;border-radius:14px;background:#fff;padding:10px}

.src-line{color:var(--muted);font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,10,30,.45);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{width:min(560px,100%);max-height:85vh;overflow:auto;padding:22px;display:grid;gap:12px;background:var(--bg)}
.modal dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.modal dt{color:var(--muted)}
.modal dd{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ring .p{stroke-dashoffset:0}}
</style>

<div dir="rtl" lang="ar">
  <!-- 1) شاشة الدخول -->
  <section class="screen" id="scrLogin">
    <div class="login">
