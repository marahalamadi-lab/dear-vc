<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>لوحة المبادرات الاستراتيجية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one RTL column — header band, KPI strip, axis + status summary, focus cards, filterable roadmap table with a quarter timeline */
:root{
  --bg:#f7f5fa; --panel:#ffffff; --ink:#1f1a29; --muted:#6b6478; --line:#e4dfec; --soft:#efeaf5;
  --brand:#6a2d96; --brand-ink:#ffffff; --brand-soft:#efe5f7; --brand-deep:#4b2378; --brand-light:#8f63c9; --logo-bg:transparent;
  --done:#1f8a5b; --done-soft:#e1f3ea; --run:#2f63c4; --run-soft:#e3ebfa;
  --late:#c2413a; --late-soft:#fae5e3; --next:#8a7f99; --next-soft:#eeebf2; --hi:#b7791f; --hi-soft:#fbf0dc;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121b; --panel:#1e1a26; --ink:#eee9f5; --muted:#a59db3; --line:#332c3f; --soft:#262030;
  --brand:#b78be0; --brand-ink:#1a1022; --brand-soft:#2e2340; --brand-deep:#c9a6ee; --brand-light:#9a6fd6; --logo-bg:#f3eff7;
  --done:#4cc28b; --done-soft:#17332a; --run:#76a2f0; --run-soft:#1a2740;
  --late:#f07c72; --late-soft:#3d1f1d; --next:#a79cb8; --next-soft:#2a2533; --hi:#e3b05a; --hi-soft:#3a2d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121b; --panel:#1e1a26; --ink:#eee9f5; --muted:#a59db3; --line:#332c3f; --soft:#262030;
  --brand:#b78be0; --brand-ink:#1a1022; --brand-soft:#2e2340; --brand-deep:#c9a6ee; --brand-light:#9a6fd6; --logo-bg:#f3eff7;
  --done:#4cc28b; --done-soft:#17332a; --run:#76a2f0; --run-soft:#1a2740;
  --late:#f07c72; --late-soft:#3d1f1d; --next:#a79cb8; --next-soft:#2a2533; --hi:#e3b05a; --hi-soft:#3a2d16; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(22px,3.2vw,30px);font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* brand row */
.brand{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.logo-chip{display:inline-flex;background:var(--logo-bg);border-radius:12px;padding:6px 10px}
.logo{height:72px;width:auto;display:block}
.dear{display:grid;justify-items:end;gap:2px}
.dear-mark{font-family:"Readex Pro",var(--f-display);font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:.06em;display:flex;gap:.28em;align-items:baseline}
.dear-mark b{font-weight:700;background:linear-gradient(135deg,var(--brand-deep),var(--brand-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.dear-mark i{font-style:normal;font-weight:400;color:var(--muted);letter-spacing:.1em}
.dear small{font-size:12px;color:var(--muted)}
/* header */
.top{display:grid;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.02em;color:var(--brand);font-weight:600}
.sub{color:var(--muted);max-width:80ch;font-size:14px}
.srcbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--next);flex:none}
.dot.live{background:var(--done);box-shadow:0 0 0 4px var(--done-soft)}
.dot.warn{background:var(--hi)}
.dot.err{background:var(--late)}
.srctext{flex:1 1 240px;min-width:0;font-size:13.5px}
.srctext b{font-weight:600}
.srctext small{display:block;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{opacity:.9;color:var(--brand-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.link-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.link-panel p{margin:0;color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;direction:ltr;text-align:left}
.files{display:grid;gap:6px;max-height:260px;overflow:auto}
.files button{display:flex;justify-content:space-between;gap:10px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px}
.files button:hover{border-color:var(--brand)}
.files small{color:var(--muted)}
.msg{font-size:13px;color:var(--muted)}
.ed{font-family:var(--f-body);border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:3px 6px;font-size:13px;min-width:0;max-width:100%;color:var(--ink)}
.ed:focus{border-color:var(--brand)}
input.ed.pc{width:64px}
input.ed.ow{width:130px}
select.ed.q{width:96px}
.fc textarea.ed{width:100%;min-height:72px;resize:vertical;font-size:13px;line-height:1.6}
.per-ed{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
td.name .ed{margin-top:4px}
.msg.err{color:var(--late)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.k-done .v{color:var(--done)} .kpi.k-run .v{color:var(--run)} .kpi.k-late .v{color:var(--late)} .kpi.k-next .v{color:var(--next)} .kpi.k-pct .v{color:var(--brand)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* summary */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h span{color:var(--muted);font-size:13px}
.axis-row{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(0,2fr) 48px;gap:12px;align-items:center;font-size:14px}
.axis-row .nm{min-width:0}
.axis-row .nm small{display:block;color:var(--muted);font-size:12px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.s-done{background:var(--done)} .s-run{background:var(--run)} .s-late{background:var(--late)} .s-next{background:var(--next);opacity:.55}
.axis-row .pc{text-align:left;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}}
.donut-wrap svg{width:150px;height:150px}
.st-list{display:grid;gap:8px;width:100%}
.st-item{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.st-item b{font-weight:600}

/* focus cards */
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.focus{grid-template-columns:minmax(0,1fr)}}
.fc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--hi);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.fc .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.fc dl{margin:0;display:grid;gap:8px}
.fc dt{font-size:12px;color:var(--muted);font-weight:600}
.fc dd{margin:0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-تمت{background:var(--done-soft);color:var(--done)}
.p-جارية{background:var(--run-soft);color:var(--run)}
.p-متأخرة{background:var(--late-soft);color:var(--late)}
.p-قادمة{background:var(--next-soft);color:var(--next)}
.p-hi{background:var(--hi-soft);color:var(--hi)}

/* table */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 10px;font-size:13.5px;min-width:0}
.filters input{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
td.per{white-space:nowrap;color:var(--muted);font-size:12.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{position:sticky;top:0;background:var(--soft);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
td.n{color:var(--muted);width:34px}
td.name{min-width:230px;max-width:340px}
td.name small{display:block;color:var(--muted);font-size:12px}
.axis-sep td{background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:13px;padding:6px 10px}
.tl{display:grid;grid-template-columns:repeat(var(--q),minmax(18px,1fr));gap:2px;min-width:260px;position:relative;height:18px}
.tl span{background:var(--soft);border-radius:3px}
.tl span.on{background:currentColor}
.tl span.now{outline:2px solid var(--brand);outline-offset:-1px}
.tl-head{display:grid;grid-template-columns:repeat(var(--q),minmax(18px,1fr));gap:2px;min-width:260px;font-size:10.5px;color:var(--muted);text-align:center}
.c-تمت{color:var(--done)} .c-جارية{color:var(--run)} .c-متأخرة{color:var(--late)} .c-قادمة{color:var(--next)}
.mini{display:flex;align-items:center;gap:6px}
.mini .bar{width:60px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notes{color:var(--muted);font-size:12.5px;display:grid;gap:4px;margin:0;padding-inline-start:18px}
.foot{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){.stack i,.bar i{transition:width .4s ease}}
</style>

/* ---------- parsing an Excel workbook (same logic as the embedded snapshot) ---------- */
const txt = v => v == null ? "" : String(v).trim();
function findHeader(rows, must){
  for (let i = 0; i < rows.length; i++){
    const cells = (rows[i] || []).map(txt);
    if (must.every(m => cells.some(c => c === m || c.startsWith(m)))) return [i, cells];
  }
  return [-1, null];
}
function col(cells, key){ let i = cells.indexOf(key); if (i < 0) i = cells.findIndex(c => c.startsWith(key)); return i < 0 ? null : i; }
function prog(v){
  if (v == null || v === "") return null;
  if (typeof v === "number") return v > 1 ? v / 100 : v;
  const s = String(v), f = parseFloat(s.replace(/[%٪\s]/g, ""));
  if (isNaN(f)) return null;
  return (f > 1 || /[%٪]/.test(s)) ? f / 100 : f;
}
function parseWorkbook(buf){
  if (!window.XLSX) throw new Error("تعذّر تحميل قارئ ملفات الإكسل. أعد تحميل الصفحة.");
  const wb = XLSX.read(buf, {type: "array"});
  const m = {title: "", subtitle: "", quarters: [], items: [], focus: {}, notes: []};
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, defval: null, raw: true, blankrows: true});
    let [hi, cells] = findHeader(rows, ["المبادرة","المحور","الحالة"]);
    if (hi >= 0 && !m.items.length){
      m.title = txt((rows[0]||[])[0]); m.subtitle = txt((rows[1]||[])[0]);
      const C = {}; ["م","المحور","المبادرة","من","إلى","المدة","الحالة","المسؤول","نسبة الإنجاز","الأولوية"].forEach(k => C[k] = col(cells, k));
      for (const r of rows.slice(hi + 1)){
        if (!r) continue;
        const g = k => C[k] == null ? null : r[C[k]];
        const nm = txt(g("المبادرة"));
        if (!nm || !txt(g("الحالة"))){ const a = txt(r[0]); if (a && !nm && a !== "دليل الاستخدام") m.notes.push(a); continue; }
        const n = g("م"), owner = txt(g("المسؤول"));
        m.items.push({n: typeof n === "number" ? Math.round(n) : m.items.length + 1, axis: txt(g("المحور")), name: nm,
          from: txt(g("من")), to: txt(g("إلى")), dur: typeof g("المدة") === "number" ? g("المدة") : null,
          status: txt(g("الحالة")), owner: (owner === "-" ? "" : owner), progress: prog(g("نسبة الإنجاز")), priority: txt(g("الأولوية"))});
      }
      continue;
    }
    [hi, cells] = findHeader(rows, ["الخطوة التالية"]);
    if (hi >= 0){
      const C = {}; ["م","الخطوة التالية","القرار المطلوب","التاريخ المستهدف"].forEach(k => C[k] = col(cells, k));
      for (const r of rows.slice(hi + 1)){
        if (!r) continue; const n = C["م"] == null ? null : r[C["م"]];
        if (typeof n !== "number") continue;
        const g = k => C[k] == null ? "" : txt(r[C[k]]);
        m.focus[String(Math.round(n))] = {next: g("الخطوة التالية"), decision: g("القرار المطلوب"), target: g("التاريخ المستهدف")};
      }
      continue;
    }
    if (rows.length && txt((rows[0]||[])[0]) === "الأرباع") m.quarters = rows.slice(1).map(r => txt((r||[])[0])).filter(Boolean);
  }
  if (!m.items.length) throw new Error("لم أجد ورقة المبادرات في الملف. تأكد أن الأعمدة «المحور» و«المبادرة» و«الحالة» ما زالت بنفس الأسماء.");
  return m;
}

/* ---------- rendering ---------- */
function currentQuarter(){ const d = new Date(); return "الربع " + QN[Math.floor(d.getMonth() / 3)] + " " + d.getFullYear(); }
function quarters(){
  if (model.quarters && model.quarters.length) return model.quarters;
  const out = []; for (let y = 2026; y <= 2028; y++) QN.forEach(q => out.push("الربع " + q + " " + y)); return out;
}
const shortName = s => s.replace(/\s*\(.*?\)\s*$/, "").trim() || s;
const shortQ = q => { const p = (q || "").split(" "), i = QN.indexOf(p[1]); return i >= 0 ? "ر" + (i + 1) + " " + p[2] : q; };
const pct = v => Math.round(v * 100) + "%";
function progressOf(it){ return it.progress != null ? it.progress : (it.status === "تمت" ? 1 : null); }

function render(){
  const items = model.items || [];
  if (model.title) $("title").textContent = model.title.replace(/^شركة قيمة المالية\s*[—-]\s*/, "");
  $("subtitle").textContent = (model.subtitle || "").split(/\s[—–-]\s/)[0];
  const cnt = {}; STATUSES.forEach(s => cnt[s] = 0); items.forEach(it => { cnt[it.status] = (cnt[it.status] || 0) + 1; });
  $("kTotal").textContent = items.length; $("kDone").textContent = cnt["تمت"]; $("kRun").textContent = cnt["جارية"];
  $("kLate").textContent = cnt["متأخرة"]; $("kNext").textContent = cnt["قادمة"];
  $("kPct").textContent = items.length ? pct(cnt["تمت"] / items.length) : "—";

  // axes
  const axes = []; items.forEach(it => { if (!axes.includes(it.axis)) axes.push(it.axis); });
  const ax = $("axes"); ax.replaceChildren();
  axes.forEach(a => {
    const list = items.filter(i => i.axis === a), c = {}; STATUSES.forEach(s => c[s] = list.filter(i => i.status === s).length);
    const row = el("div", "axis-row"), nm = el("div", "nm", a);
    nm.appendChild(el("small", "num", list.length + " مبادرات · " + c["تمت"] + " تمت · " + c["متأخرة"] + " متأخرة"));
    const st = el("div", "stack"); st.setAttribute("role", "img"); st.setAttribute("aria-label", a + ": " + STATUSES.map(s => s + " " + c[s]).join("، "));
    [["تمت","s-done"],["جارية","s-run"],["متأخرة","s-late"],["قادمة","s-next"]].forEach(([s, k]) => { if (c[s]) { const i = el("i", k); i.style.width = (c[s] / list.length * 100) + "%"; i.title = s + ": " + c[s]; st.appendChild(i); } });
    row.append(nm, st, el("div", "pc num", pct(c["تمت"] / list.length)));
    ax.appendChild(row);
  });
  const fa = $("fAxis"), keep = fa.value; fa.replaceChildren(el("option", null, "كل المحاور")); fa.firstChild.value = "";
  axes.forEach(a => { const o = el("option", null, a); o.value = a; fa.appendChild(o); }); fa.value = axes.includes(keep) ? keep : "";

  $("curQ").textContent = "الربع الحالي: " + currentQuarter();

  // focus
  const fc = $("focus"); fc.replaceChildren();
  const hi = items.filter(i => i.priority === "عالية");
  if (!hi.length) fc.appendChild(el("div", "empty", "لا توجد مبادرات بأولوية «عالية» في الملف حالياً."));
  hi.forEach(it => {
    const f = (model.focus || {})[String(it.n)] || {}, card = el("article", "fc");
    const meta = el("div", "meta"); meta.append(el("span", "pill p-hi", "م" + it.n), el("span", "pill p-" + it.status, it.status), el("span", null, it.owner ? "المسؤول: " + it.owner : "لم يُحدَّد المسؤول"));
    const p = progressOf(it), pb = el("div", "mini"), bar = el("div", "bar"), bi = el("i"); bi.style.width = ((p || 0) * 100) + "%"; bar.appendChild(bi); pb.append(bar, el("span", "num", p == null ? "لم تُحدَّث" : pct(p)));
    const dl = el("dl");
    [["الخطوة التالية", "next"], ["القرار المطلوب", "decision"]].forEach(([k, key]) => {
      if (editing){
        const ta = el("textarea", "ed"); ta.value = f[key] || ""; ta.setAttribute("aria-label", k);
        ta.addEventListener("change", () => { model.focus = model.focus || {}; const ff = model.focus[String(it.n)] = model.focus[String(it.n)] || {next: "", decision: "", target: ""}; ff[key] = ta.value.trim(); render(); });
        dl.append(el("dt", null, k), ta);
      } else if (f[key]) dl.append(el("dt", null, k), el("dd", null, f[key]));
    });
    card.append(meta, el("h3", null, shortName(it.name)), pb, dl); fc.appendChild(card);
  });

  // chips
  const ch = $("chips"); ch.replaceChildren();
  [["", "الكل (" + items.length + ")"]].concat(STATUSES.map(s => [s, s + " (" + cnt[s] + ")"])).forEach(([v, l]) => {
    const b = el("button", "chip", l); b.type = "button"; b.setAttribute("aria-pressed", String(filterStatus === v));
    b.addEventListener("click", () => { filterStatus = v; render(); }); ch.appendChild(b);
  });

  // notes
  renderTable();
  updatePublishBtn();
}

const dirty = () => JSON.stringify(model) !== JSON.stringify(EMBED);
const fmtTime = t => new Date(t).toLocaleString("ar-SA-u-nu-latn", {dateStyle: "medium", timeStyle: "short"});
function setSource(kind, main, sub){ $("srcdot").className = "dot " + (kind || ""); $("srcmain").textContent = main; $("srcsub").textContent = sub || ""; }
function updatePublishBtn(){
  const d = canEdit && dirty();
  $("btnPublish").hidden = !(d && artifactNs); $("btnDiscard").hidden = !d;
  $("btnEdit").textContent = editing ? "إنهاء التعديل" : "تعديل البيانات";
  if (d) setSource("warn", "لديك تعديلات لم تُنشر بعد", "اضغطي «نشر للجميع» ليراها كل من لديه الرابط.");
  else if (editing) setSource("warn", "وضع التعديل", "عدّلي مباشرة في الجدول وبطاقات الأولوية العالية.");
  else setSource("live", "آخر تحديث للبيانات", model.updatedAt ? fmtTime(model.updatedAt) : ((model.subtitle || "").split(/\s[—–-]\s/)[0] || ""));
}
function mkSelect(opts, val, set, label, cls){
  const s = el("select", "ed" + (cls ? " " + cls : "")); s.setAttribute("aria-label", label);
  const all = opts.includes(val) || !val ? opts : [val].concat(opts);
  all.forEach(o => { const op = el("option", null, cls === "q" ? shortQ(o) : o); op.value = o; s.appendChild(op); });
  s.value = val || ""; s.addEventListener("change", () => { set(s.value); render(); }); return s;
}
function mkInput(val, set, label, cls){
  const i = el("input", "ed" + (cls ? " " + cls : "")); i.value = val; i.setAttribute("aria-label", label);
  i.addEventListener("change", () => { set(i.value); render(); }); return i;
}
function buildDoc(m){
  const bin = atob(SELF_B64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const T = new TextDecoder().decode(bytes);
  const logo = (document.querySelector("img.logo").getAttribute("src") || "").split(",")[1] || "";
  const content = T.split(PH_LOGO).join(logo).split(PH_MODEL).join(JSON.stringify(m).replace(/<\//g, "<\\/")).split(PH_SELF).join(JSON.stringify(SELF_B64));
  const reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + content + '</body></html>';
}
function renderTable(){
  const items = model.items || [], Q = quarters(), now = currentQuarter(), nowIdx = Q.indexOf(now);
  const head = $("tlHead"); head.replaceChildren(); const hd = el("div", "tl-head"); hd.style.setProperty("--q", Q.length);
  Q.forEach((q, i) => { const parts = q.split(" "); const qi = QN.indexOf(parts[1]); const s = el("span", null, (qi >= 0 ? "ر" + (qi + 1) : "") + (qi === 0 || i === 0 ? " " + (parts[2] || "").slice(2) : "")); s.title = q; hd.appendChild(s); });
  head.appendChild(hd);
  const qv = $("q").value.trim(), fa = $("fAxis").value, fp = $("fPri").value;
  const list = items.filter(it => (!filterStatus || it.status === filterStatus) && (!fa || it.axis === fa) && (!fp || it.priority === fp) && (!qv || (it.name + " " + it.owner).includes(qv)));
  const tb = $("tbody"); tb.replaceChildren(); let lastAxis = null;
  $("countLbl").textContent = list.length === items.length ? items.length + " مبادرة" : list.length + " من " + items.length;
  if (!list.length){ const tr = el("tr"), td = el("td", "empty", "لا توجد مبادرات تطابق التصفية."); td.colSpan = 7; tr.appendChild(td); tb.appendChild(tr); return; }
  list.forEach(it => {
    if (it.axis !== lastAxis){ lastAxis = it.axis; const tr = el("tr", "axis-sep"), td = el("td", null, it.axis); td.colSpan = 7; tr.appendChild(td); tb.appendChild(tr); }
    const tr = el("tr");
    const nm = el("td", "name", shortName(it.name)); nm.title = it.name;
    if (editing) nm.appendChild(el("div", null)).appendChild(mkSelect(["عالية", "تُرتَّب لاحقاً"], it.priority, v => it.priority = v, "الأولوية"));
    else if (it.priority === "عالية"){ nm.prepend(el("span", "pill p-hi", "أولوية عالية"), document.createTextNode(" ")); }
    const st = el("td"); st.appendChild(editing ? mkSelect(STATUSES, it.status, v => it.status = v, "الحالة") : el("span", "pill p-" + it.status, it.status));
    const p = progressOf(it), pg = el("td");
    if (editing){ const inp = mkInput(it.progress == null ? "" : Math.round(it.progress * 100), v => { const f = parseFloat(v); it.progress = isNaN(f) ? null : Math.max(0, Math.min(100, f)) / 100; }, "نسبة الإنجاز ٪", "pc"); inp.type = "number"; inp.min = 0; inp.max = 100; pg.appendChild(inp); }
    else { const mini = el("div", "mini"), bar = el("div", "bar"), bi = el("i"); bi.style.width = ((p || 0) * 100) + "%"; bar.appendChild(bi); mini.append(bar, el("span", "num", p == null ? "—" : pct(p))); pg.appendChild(mini); }
    const ow = el("td"); if (editing) ow.appendChild(mkInput(it.owner || "", v => it.owner = v.trim(), "المسؤول", "ow")); else ow.textContent = it.owner || "—";
    const per = el("td", "per num");
    if (editing){ const w = el("div", "per-ed"); const setDur = () => { const a2 = Q.indexOf(it.from), b2 = Q.indexOf(it.to); if (a2 >= 0 && b2 >= a2) it.dur = b2 - a2 + 1; };
      w.append(mkSelect(Q, it.from, v => { it.from = v; setDur(); }, "من", "q"), el("span", null, "←"), mkSelect(Q, it.to, v => { it.to = v; setDur(); }, "إلى", "q")); per.appendChild(w); }
    else per.textContent = shortQ(it.from) + (it.to && it.to !== it.from ? " ← " + shortQ(it.to) : "");
    const tlc = el("td"), tl = el("div", "tl c-" + it.status); tl.style.setProperty("--q", Q.length);
    const a = Q.indexOf(it.from), b = Q.indexOf(it.to);
    Q.forEach((q, i) => { const s = el("span"); if (a >= 0 && i >= a && i <= (b >= 0 ? b : a)) s.className = "on"; if (i === nowIdx) s.classList.add("now"); s.title = q; tl.appendChild(s); });
    tl.setAttribute("aria-label", it.from + " إلى " + it.to); tlc.appendChild(tl);
    tr.append(el("td", "n num", it.n), nm, st, ow, per, pg, tlc);
    tb.appendChild(tr);
  });
}
["q","fAxis","fPri"].forEach(id => $(id).addEventListener("input", renderTable));

/* ---------- controls ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
$("btnEdit").addEventListener("click", () => { editing = !editing; render(); });
$("btnDiscard").addEventListener("click", () => { model = clone(EMBED); editing = false; render(); });
$("btnPublish").addEventListener("click", async () => {
  const b = $("btnPublish"); b.disabled = true; b.textContent = "جارٍ النشر…";
  const m = clone(model); m.updatedAt = Date.now();
  try{ await artifactNs.publish(buildDoc(m)); b.textContent = "تم النشر"; setSource("live", "تم النشر", "يرى الجميع الآن البيانات المحدّثة."); }
  catch(e){
    const c = e && e.code; b.disabled = false; b.textContent = "نشر للجميع";
    setSource("err", "لم يُنشر التحديث", c === "conflict" ? "نُشرت نسخة أخرى للتو. أعيدي تحميل الصفحة ثم حاولي مجدداً." : (c === "not_granted" || c === "not_writer") ? "النشر متاح لصاحبة الصفحة فقط." : ((e && e.message) || "حاولي مرة أخرى."));
  }
});
$("fileUp").addEventListener("change", async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try{ const m = parseWorkbook(new Uint8Array(await f.arrayBuffer())); if (model.updatedAt) m.updatedAt = model.updatedAt; model = m; editing = false; render(); }
  catch(e){ setSource("err", "تعذّر قراءة ملف الإكسل", e.message); }
});
function exportXlsx(){
  const wb = XLSX.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]};
  const head = ["م","المحور","المبادرة","من","إلى","المدة للانطلاق(أرباع)","الحالة","المسؤول","نسبة الإنجاز","الأولوية"];
  const rows = [[model.title || ""], [model.subtitle || ""], [], head].concat((model.items || []).map(it => [it.n, it.axis, it.name, it.from, it.to, it.dur, it.status, it.owner || "-", it.progress, it.priority]));
  rows.push([], ["دليل الاستخدام"]); (model.notes || []).forEach(n => rows.push([n]));
  const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = [4,24,48,16,16,10,10,16,10,14].map(w => ({wch: w}));
  (model.items || []).forEach((it, i) => { const c = ws[XLSX.utils.encode_cell({r: 4 + i, c: 8})]; if (c && typeof c.v === "number") c.z = "0%"; });
  XLSX.utils.book_append_sheet(wb, ws, "المبادرات الاستراتيجية");
  const fh = ["م","المبادرة","المسؤول","من","إلى","الحالة","نسبة الإنجاز","الخطوة التالية","القرار المطلوب من اللجنة","التاريخ المستهدف / المخاطر"];
  const frows = [fh].concat((model.items || []).filter(it => it.priority === "عالية").map(it => { const f = (model.focus || {})[String(it.n)] || {}; return [it.n, it.name, it.owner || "", it.from, it.to, it.status, progressOf(it) || 0, f.next || "", f.decision || "", f.target || ""]; }));
  const fws = XLSX.utils.aoa_to_sheet(frows); fws["!cols"] = [4,40,16,16,16,10,10,50,40,40].map(w => ({wch: w}));
  XLSX.utils.book_append_sheet(wb, fws, "الأولوية العالية");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["الأرباع"]].concat(quarters().map(q => [q]))), "المرجع");
  return new Uint8Array(XLSX.write(wb, {bookType: "xlsx", type: "array"}));
}
$("btnExport").addEventListener("click", async () => {
  if (!downloads || !window.XLSX) return;
  try{ await downloads.save({filename: "المبادرات_الاستراتيجية_" + new Date().toISOString().slice(0, 10) + ".xlsx", data: exportXlsx()}); }
  catch(e){ if (e && e.code && !/declin|cancel|abort|denied/.test(e.code)) setSource("err", "تعذّر تنزيل الملف", e.message || ""); }
});

/* boot */
render();
(async () => {
  const c = window.claude; if (!c || !c.use) return;
  const [u, a, d] = await Promise.all(["user", "artifact", "downloads"].map(n => c.use(n).catch(() => null)));
  artifactNs = a; downloads = d;
  try{ canEdit = u ? await u.canEdit() : false; } catch(e){ canEdit = false; }
  $("editTools").hidden = !canEdit; $("btnExport").hidden = !downloads;
  render();
})();
})();
</script>
</body></html>
